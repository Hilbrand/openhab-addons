# add-on

addon.stookwijzer.name = Stookwijzer Binding
addon.stookwijzer.description = Integrates the RIVM Stookwijzer into openHAB. Stookwijzer provides wood-burning advice (yellow/orange/red) per 4-digit postal code area based on wind force and air quality index (LKI). Data source: RIVM WMS (https://data.rivm.nl/geo/alo/wms).

# thing types

thing-type.stookwijzer.location.label = Stookwijzer Location
thing-type.stookwijzer.location.description = Stookwijzer advice for a location in the Netherlands, configured using RD New coordinates. Provides wind speed, air quality index and burning advice (yellow/orange/red) per 6-hour time block.
thing-type.stookwijzer.location.channel.advies_0.label = Advice Time Block 0-6 h
thing-type.stookwijzer.location.channel.advies_0.description = Burning advice for the first time block (0 to 6 hours after model run).
thing-type.stookwijzer.location.channel.advies_12.label = Advice Time Block 12-18 h
thing-type.stookwijzer.location.channel.advies_12.description = Burning advice for the third time block (12 to 18 hours after model run).
thing-type.stookwijzer.location.channel.advies_18.label = Advice Time Block 18-24 h
thing-type.stookwijzer.location.channel.advies_18.description = Burning advice for the fourth time block (18 to 24 hours after model run).
thing-type.stookwijzer.location.channel.advies_6.label = Advice Time Block 6-12 h
thing-type.stookwijzer.location.channel.advies_6.description = Burning advice for the second time block (6 to 12 hours after model run).
thing-type.stookwijzer.location.channel.definitief_0.label = Advice Final Time Block 0-6 h
thing-type.stookwijzer.location.channel.definitief_0.description = Whether the advice for time block 0-6 h has been finalised.
thing-type.stookwijzer.location.channel.definitief_12.label = Advice Final Time Block 12-18 h
thing-type.stookwijzer.location.channel.definitief_12.description = Whether the advice for time block 12-18 h has been finalised.
thing-type.stookwijzer.location.channel.definitief_18.label = Advice Final Time Block 18-24 h
thing-type.stookwijzer.location.channel.definitief_18.description = Whether the advice for time block 18-24 h has been finalised.
thing-type.stookwijzer.location.channel.definitief_6.label = Advice Final Time Block 6-12 h
thing-type.stookwijzer.location.channel.definitief_6.description = Whether the advice for time block 6-12 h has been finalised.

# thing types config

thing-type.config.stookwijzer.location.rdX.label = RD New X Coordinate
thing-type.config.stookwijzer.location.rdX.description = X-coordinate of the location in the RD New system (EPSG:28992), in metres. Valid range for the Netherlands: 7000 - 300000.
thing-type.config.stookwijzer.location.rdY.label = RD New Y Coordinate
thing-type.config.stookwijzer.location.rdY.description = Y-coordinate of the location in the RD New system (EPSG:28992), in metres. Valid range for the Netherlands: 289000 - 629000.
thing-type.config.stookwijzer.location.refreshInterval.label = Refresh Interval (minutes)
thing-type.config.stookwijzer.location.refreshInterval.description = How often data is fetched from the RIVM WMS service. Stookwijzer updates every 6 hours; 30 minutes is recommended.

# channel types

channel-type.stookwijzer.channel-advies.label = Burning Advice
channel-type.stookwijzer.channel-advies.description = Burning advice as a colour code: -1 = no advice, 0 = yellow (caution), 1 = orange (better not to burn), 2 = red (do not burn).
channel-type.stookwijzer.channel-advies.state.option.-1 = No advice
channel-type.stookwijzer.channel-advies.state.option.0 = Yellow
channel-type.stookwijzer.channel-advies.state.option.1 = Orange
channel-type.stookwijzer.channel-advies.state.option.2 = Red
channel-type.stookwijzer.channel-definitief.label = Advice Finalised
channel-type.stookwijzer.channel-definitief.description = Indicates whether the burning advice for this time block is final (ON = final, OFF = may still change). An advice is finalised at most 6 hours before the time block starts.
channel-type.stookwijzer.channel-lki.label = Air Quality Index (LKI)
channel-type.stookwijzer.channel-lki.description = Calculated Air Quality Index (LuchtKwaliteitsIndex) for the first time block. -1 = no value available; 1 = good; 11 = very poor.
channel-type.stookwijzer.channel-lki.state.option.-1 = No value
channel-type.stookwijzer.channel-lki.state.option.1 = 1 - Good
channel-type.stookwijzer.channel-lki.state.option.2 = 2 - Good
channel-type.stookwijzer.channel-lki.state.option.3 = 3 - Moderate
channel-type.stookwijzer.channel-lki.state.option.4 = 4 - Moderate
channel-type.stookwijzer.channel-lki.state.option.5 = 5 - Insufficient
channel-type.stookwijzer.channel-lki.state.option.6 = 6 - Insufficient
channel-type.stookwijzer.channel-lki.state.option.7 = 7 - Insufficient
channel-type.stookwijzer.channel-lki.state.option.8 = 8 - Poor
channel-type.stookwijzer.channel-lki.state.option.9 = 9 - Poor
channel-type.stookwijzer.channel-lki.state.option.10 = 10 - Poor
channel-type.stookwijzer.channel-lki.state.option.11 = 11 - Very poor
channel-type.stookwijzer.channel-model-runtime.label = Model Run Timestamp
channel-type.stookwijzer.channel-model-runtime.description = Date and time when the model calculation was run (format: dd-mm-yyyy hh:mm).
channel-type.stookwijzer.channel-pc4.label = Postal Code (PC4)
channel-type.stookwijzer.channel-pc4.description = 4-digit postal code area for which the advice is calculated.
channel-type.stookwijzer.channel-wind-bft.label = Wind Force (Beaufort)
channel-type.stookwijzer.channel-wind-bft.description = Average wind force in the first time block (0 to 6 hours after model run), in Beaufort. At wind force 2 or below, Stookwijzer always issues a red advice.
channel-type.stookwijzer.channel-wind.label = Wind Speed (m/s)
channel-type.stookwijzer.channel-wind.description = Average wind speed in the first time block (0 to 6 hours after model run), in metres per second.
channel-type.stookwijzer.channel-windrichting.label = Wind Direction
channel-type.stookwijzer.channel-windrichting.description = Wind direction in degrees (0-360). -1 means no value available.
