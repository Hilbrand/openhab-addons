# add-on

addon.stookwijzer.name = Stookwijzer Binding
addon.stookwijzer.description = Integrates the RIVM Stookwijzer into openHAB. Stookwijzer provides wood-burning advice (yellow/orange/red) per 4-digit postal code area based on wind force and air quality index (LKI). Data source: RIVM WMS (https://data.rivm.nl/geo/alo/wms).

# thing types

thing-type.stookwijzer.location.label = Stookwijzer location
thing-type.stookwijzer.location.description = Stookwijzer advies voor een location in Nederland, gebaseerd op RD New coördinaten. Geeft windsnelheid, luchtkwaliteitsindex en stookadvies (geel/oranje/rood) per tijdsblok van 6 uur.
thing-type.stookwijzer.location.channel.advies_0.label = Advies tijdsblok 0-6 uur
thing-type.stookwijzer.location.channel.advies_0.description = Stookadvies voor het eerste tijdsblok (0 tot 6 uur na modelrun).
thing-type.stookwijzer.location.channel.advies_12.label = Advies tijdsblok 12-18 uur
thing-type.stookwijzer.location.channel.advies_12.description = Stookadvies voor het derde tijdsblok (12 tot 18 uur na modelrun).
thing-type.stookwijzer.location.channel.advies_18.label = Advies tijdsblok 18-24 uur
thing-type.stookwijzer.location.channel.advies_18.description = Stookadvies voor het vierde tijdsblok (18 tot 24 uur na modelrun).
thing-type.stookwijzer.location.channel.advies_6.label = Advies tijdsblok 6-12 uur
thing-type.stookwijzer.location.channel.advies_6.description = Stookadvies voor het tweede tijdsblok (6 tot 12 uur na modelrun).
thing-type.stookwijzer.location.channel.definitief_0.label = Definitief tijdsblok 0-6 uur
thing-type.stookwijzer.location.channel.definitief_0.description = Of het advies voor tijdsblok 0-6 uur definitief is vastgesteld.
thing-type.stookwijzer.location.channel.definitief_12.label = Definitief tijdsblok 12-18 uur
thing-type.stookwijzer.location.channel.definitief_12.description = Of het advies voor tijdsblok 12-18 uur definitief is vastgesteld.
thing-type.stookwijzer.location.channel.definitief_18.label = Definitief tijdsblok 18-24 uur
thing-type.stookwijzer.location.channel.definitief_18.description = Of het advies voor tijdsblok 18-24 uur definitief is vastgesteld.
thing-type.stookwijzer.location.channel.definitief_6.label = Definitief tijdsblok 6-12 uur
thing-type.stookwijzer.location.channel.definitief_6.description = Of het advies voor tijdsblok 6-12 uur definitief is vastgesteld.

# thing types config

thing-type.config.stookwijzer.location.rdX.label = RD New X-coördinaat
thing-type.config.stookwijzer.location.rdX.description = X-coördinaat van de location in het RD New stelsel (EPSG:28992), in meters. Geldig bereik voor Nederland: 7000 - 300000. Voorbeeld Utrecht centrum: 136372.
thing-type.config.stookwijzer.location.rdY.label = RD New Y-coördinaat
thing-type.config.stookwijzer.location.rdY.description = Y-coördinaat van de location in het RD New stelsel (EPSG:28992), in meters. Geldig bereik voor Nederland: 289000 - 629000. Voorbeeld Utrecht centrum: 457489.
thing-type.config.stookwijzer.location.refreshInterval.label = Verversingsinterval (minuten)
thing-type.config.stookwijzer.location.refreshInterval.description = Hoe vaak de data wordt opgehaald van de RIVM WMS service. De Stookwijzer wordt elke 6 uur bijgewerkt; 30 minuten is aanbevolen.

# channel types

channel-type.stookwijzer.channel-advies.label = Stookadvies
channel-type.stookwijzer.channel-advies.description = Stookadvies als kleurcode: -1 = geen advies, 0 = geel (let op), 1 = oranje (beter niet stoken), 2 = rood (niet stoken).
channel-type.stookwijzer.channel-advies.state.option.-1 = Geen
channel-type.stookwijzer.channel-advies.state.option.0 = Geel
channel-type.stookwijzer.channel-advies.state.option.1 = Oranje
channel-type.stookwijzer.channel-advies.state.option.2 = Rood
channel-type.stookwijzer.channel-definitief.label = Advies definitief
channel-type.stookwijzer.channel-definitief.description = Geeft aan of het stookadvies voor dit tijdsblok definitief is (ON = ja, OFF = kan nog wijzigen). Een advies wordt definitief uiterlijk 6 uur vóór het tijdsblok.
channel-type.stookwijzer.channel-lki.label = Luchtkwaliteitsindex (LKI)
channel-type.stookwijzer.channel-lki.description = Berekende LuchtKwaliteitsIndex voor het eerste tijdsblok.			-1 = geen waarde beschikbaar; 1 = goed; 11 =			zeer slecht.
channel-type.stookwijzer.channel-lki.state.option.-1 = Geen waarde
channel-type.stookwijzer.channel-lki.state.option.1 = 1 - Goed
channel-type.stookwijzer.channel-lki.state.option.2 = 2 - Goed
channel-type.stookwijzer.channel-lki.state.option.3 = 3 - Matig
channel-type.stookwijzer.channel-lki.state.option.4 = 4 - Matig
channel-type.stookwijzer.channel-lki.state.option.5 = 5 - Onvoldoende
channel-type.stookwijzer.channel-lki.state.option.6 = 6 - Onvoldoende
channel-type.stookwijzer.channel-lki.state.option.7 = 7 - Onvoldoende
channel-type.stookwijzer.channel-lki.state.option.8 = 8 - Slecht
channel-type.stookwijzer.channel-lki.state.option.9 = 9 - Slecht
channel-type.stookwijzer.channel-lki.state.option.10 = 10 - Slecht
channel-type.stookwijzer.channel-lki.state.option.11 = 11 - Zeer slecht
channel-type.stookwijzer.channel-model-runtime.label = Modelrun tijdstip
channel-type.stookwijzer.channel-model-runtime.description = Datum en tijd waarop de berekening is uitgevoerd (formaat: dd-mm-jjjj uu:mm).
channel-type.stookwijzer.channel-pc4.label = Postcode (PC4)
channel-type.stookwijzer.channel-pc4.description = 4-cijferig postcodegebied waarvoor het advies is berekend.
channel-type.stookwijzer.channel-wind-bft.label = Windkracht (Beaufort)
channel-type.stookwijzer.channel-wind-bft.description = Gemiddelde windkracht in het eerste tijdsblok (0 tot 6 uur na modelrun), in Beaufort. Bij windkracht 2 of minder geeft de Stookwijzer altijd code rood.
channel-type.stookwijzer.channel-wind.label = Windsnelheid (m/s)
channel-type.stookwijzer.channel-wind.description = Gemiddelde windsnelheid in het eerste tijdsblok (0 tot 6 uur na modelrun), in meter per seconde.
channel-type.stookwijzer.channel-windrichting.label = Windrichting
channel-type.stookwijzer.channel-windrichting.description = Windrichting in graden (0-360). -1 betekent geen waarde beschikbaar.
